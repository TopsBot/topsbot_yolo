# tb_img 订阅 + YOLO11-Pose（17 关键点姿态估计，配合 usb_cam mjpeg2nv12_*_zc）
# 注：yolo11_pose 模型为 BGR CPU 版，backend 内部完成 NV12→BGR 转换，对外接口与 tb_img_yolo11_640x480.yaml 一致
/**:
  ros__parameters:
    input_msg: tb_img
    input_topic: /tbmem_img
    tb_img_profile: "480p"
    frame_id: camera
    publish_detections: true
    detections_topic: /detections
    frame_skip: 0
    enable_profile: true
    model_type: yolo11_pose
    model_path: ~/topsbot/models/yolo11s_pose_float16.nb
    preprocess:
      letterbox: true
      letterbox_color: [114, 114, 114]
      auto_input_size: true
      input_width: 640
      input_height: 640
    postprocess:
      confidence_threshold: 0.50
      nms_threshold: 0.45
      max_detections: 100
