# sensor_image 订阅 + YOLO11（PC / 非零拷贝，配合 usb_cam mjpeg2nv12_*_sensor）
/**:
  ros__parameters:
    input_msg: sensor_image
    input_topic: /image_raw
    frame_id: camera
    publish_detections: true
    detections_topic: /detections
    frame_skip: 0
    enable_profile: true
    model_type: yolo11
    model_path: ~/topsbot/models/yolo11s_nv12_float16.nb
    preprocess:
      letterbox: true
      letterbox_color: [114, 114, 114]
      auto_input_size: true
      input_width: 640
      input_height: 640
    postprocess:
      confidence_threshold: 0.25
      nms_threshold: 0.45
      max_detections: 300
